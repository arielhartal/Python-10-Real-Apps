<!DOCTYPE HTML PUBLIC "-//W3C//DTD HTML 3.2//EN">
<!--
DESCRIPTION: Implements incremental search for the Index.
NOTES:
-->

<HTML>

<HEAD>

<SCRIPT LANGUAGE = "JavaScript1.2">

var timeoutDuration = 900
var bfillinHasFocus = false

// Bind events to global event handlers.
top.bindDocEvts( document )

function onload()
{
   // Start a timer, so that we can monitor what the user has typed.
   document.MyForm.theTextField.value = ""
   window.setInterval( "timeoutCallback()", timeoutDuration )

   // Give the text object focus.
   document.MyForm.theTextField.focus()
}

/*
DESCR:   At each timeout, load the keywords if the fill-in value has changed.
PARAMS:  
RETURNS: 
NOTES:   
*/
function timeoutCallback()
{
   if ( parent.bKeysDocLoading ) return
   	
   // Since the value of document.MyForm.testOutput.value will not change
   // until the user gives up focus on the edit field, we'll temporarily
   // give it up. If it doesn't have focus now, than we can 
   // trust that the value property is up-to-date.
   if ( bfillinHasFocus ) {
      document.layers[ "Layer1" ].document.Form1.textObj1.focus()
      document.MyForm.theTextField.focus()
      bfillinHasFocus = true
   }
	
   if ( document.MyForm.theTextField.value != parent.lastKnownValue ) {
      parent.lastKnownValue = document.MyForm.theTextField.value
      parent.bKeysDocLoading = true
      top.StatusFrame.setStatusWait()
      parent.KeywordFrame.location.replace( "IdxKey.htm" )
   }
}

</SCRIPT>

</HEAD>

<BODY BGCOLOR = "#99ccff">

<STYLE TYPE = 'text/javascript'>
classes.keyword.all.fontFamily = 'arial';
classes.keyword.all.fontSize = '13px';
classes.keyword.all.marginTop = 4;
classes.keyword.all.marginBottom = 4;
classes.keyword.all.color = '#000066';
</STYLE>

<DIV CLASS = keyword>

<FORM NAME = "MyForm" OnSubmit = "return false">
Look for: 
<BR>
<INPUT TYPE = "TEXT" SIZE = 9 NAME = "theTextField" OnBlur = "bfillinHasFocus = false" OnFocus = "bfillinHasFocus = true">
</FORM>

</DIV>

<LAYER NAME = "Layer1" VISIBILITY = hide>
<FORM NAME = "Form1">
<INPUT TYPE = "TEXT" SIZE = 10 NAME = "textObj1">
</FORM>
</LAYER>

</BODY>
